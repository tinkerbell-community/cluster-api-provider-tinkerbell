  - additionalPrinterColumns:
    - description: Cluster to which this TinkerbellMachine belongs
      jsonPath: .metadata.labels.cluster\.x-k8s\.io/cluster-name
      name: Cluster
      type: string
    - description: Tinkerbell instance state
      jsonPath: .status.state
      name: State
      type: string
    - description: Machine ready status
      jsonPath: .status.ready
      name: Ready
      type: string
    - description: Tinkerbell instance ID
      jsonPath: .spec.providerID
      name: InstanceID
      type: string
    - description: Machine object which owns with this TinkerbellMachine
      jsonPath: .metadata.ownerReferences[?(@.kind=="Machine")].name
      name: Machine
      type: string
    name: v1beta2
    schema:
      openAPIV3Schema:
        description: TinkerbellMachine is the Schema for the tinkerbellmachines API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              TinkerbellMachineSpec defines the desired state of TinkerbellMachine.
              It embeds TinkerbellMachineConfig (user-intent fields from the template) and adds
              controller-managed fields that are set at runtime during hardware selection.
              The embedded fields flatten into the JSON spec, so the CRD schema is unchanged.
            properties:
              addressFromPool:
                description: |-
                  AddressFromPool names a Cluster API IPAM pool an address is claimed from for the
                  machine's primary network interface (spec.interfaces[0] on the selected Hardware).
                  The allocated address, netmask and gateway are written to that interface's DHCP
                  reservation, so Tinkerbell hands the machine that address, and it is reported as the
                  machine's address. Immutable once Hardware is selected.
                properties:
                  apiGroup:
                    description: |-
                      apiGroup of the IPPool.
                      apiGroup must be fully qualified domain name.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  kind:
                    description: |-
                      kind of the IPPool.
                      kind must consist of alphanumeric characters or '-', start with an alphabetic character, and end with an alphanumeric character.
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-zA-Z]([-a-zA-Z0-9]*[a-zA-Z0-9])?$
