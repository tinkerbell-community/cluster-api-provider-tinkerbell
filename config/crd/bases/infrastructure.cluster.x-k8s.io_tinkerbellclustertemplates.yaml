                                  type: object
                                isoURL:
                                  description: |-
                                    ISOURL is the URL of the ISO that will be one-time booted.
                                    When this field is set, a job.bmc.tinkerbell.org object will be created
                                    for getting the associated Hardware into a CDROM booting state.
                                    A Workflow Hardware Reference that contains a bmc must be provided.
                                    BootMode must be set to "isoboot".
                                  format: uri
                                  type: string
                                toggleNetboot:
                                  description: |-
                                    ToggleNetboot indicates whether the the field in the associated Hardware for allowing network booting should
                                    be enabled before the Task is executed and disabled after the Task has completed successfully.
                                    A Hardware Reference must be provided.
                                  type: boolean
                              type: object
                            name:
                              description: |-
                                Name identifies the entry. A Task CAPT creates from TaskInline is named
                                <machine name>-<name>.
                              maxLength: 63
                              pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                              type: string
                            taskInline:
                              description: |-
                                TaskInline is a Task definition. CAPT creates it as a Task owned by the machine and
                                deletes it with the machine. Its templates are rendered by Tinkerbell with v1alpha2
                                data, such as {{ (index .hardware.spec.storageDevices 0).name }}. It cannot set
                                references: those read other objects with the access Tinkerbell's Policy gives Tasks,
                                which CAPT does not grant to whoever can write a machine; put them in a Task you
                                manage and use TaskRef. Mutually exclusive with TaskRef.
                              properties:
                                actions:
                                  description: Actions are the list of individual
                                    Actions that are part of this Task.
                                  items:
                                    description: Action represents a Task Action.
                                    properties:
                                      args:
                                        description: Args are a set of arguments to
                                          be passed to the command executed by the
                                          container on launch.
                                        items:
                                          type: string
                                        type: array
                                      background:
                                        description: |-
                                          Background or Detach indicates that the Action should be run in the background and not block the execution of other Actions.
                                          The Action will report back as successful before the Action is executed in the background.
                                          Then the Action will be run in the background and move on to the next Action immediately without waiting for completion.
                                          This is useful for Actions that do things like kexec, reboot, or power off a machine.
                                        type: boolean
                                      command:
                                        description: |-
                                          Command defines the command to use when launching the image. It overrides the default command
                                          (entrypoint) of the Action image. It is the path to an executable program, or a program name
                                          resolved through the image's PATH, as Docker does. When omitted, the image's default
                                          command/entrypoint is used.
                                        pattern: ^\S+$
                                        type: string
