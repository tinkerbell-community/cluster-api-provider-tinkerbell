                                            type: string
                                          pid:
                                            description: PID defines the PID namespace
                                            type: string
                                        type: object
                                      retries:
                                        description: |-
                                          Retries is the number of times the Action should be run until completed successfully.
                                          Zero value means no retries.
                                        minimum: 0
                                        type: integer
                                      timeoutSeconds:
                                        description: |-
                                          TimeoutSeconds is the total number of seconds the Action is allowed to run without completing
                                          before marking it as timed out.
                                          This includes all retries.
                                        format: int64
                                        type: integer
                                      volumes:
                                        description: Volumes defines the volumes that
                                          will be mounted into the container.
                                        items:
                                          description: "Volume is a specification
                                            for mounting a location on a Host into
                                            an Action container.\nVolumes take the
                                            form {SRC-VOLUME-NAME | SRC-HOST-DIR}:TGT-CONTAINER-DIR:OPTIONS.\nWhen
                                            specifying a VOLUME-NAME that does not
                                            exist it will be created for you.\nExamples:\n\nRead-only
                                            bind mount bound to /data\n\n\t/etc/data:/data:ro\n\nWritable
                                            volume name bound to /data\n\n\tshared_volume:/data\n\nSee
