                            minLength: 1
                            type: string
                          port:
                            description: port is the port on which the API server
                              is serving.
                            format: int32
                            maximum: 65535
                            minimum: 1
                            type: integer
                        type: object
                      tasks:
                        description: |-
                          Tasks are the Tinkerbell v1alpha2 Tasks run in order to provision every machine in the
                          cluster, each given inline or by reference. A machine's own tasks or template, or its
                          Hardware's annotations, take precedence. Mutually exclusive with TemplateInline and
                          TemplateRef.
                        items:
                          description: |-
                            MachineTask is one Task the machine's Workflow runs, given inline or by reference, with the
                            boot options applied around it, as in a task of a Tinkerbell v1alpha2 Workflow.
                          properties:
                            bootOptions:
                              description: |-
                                BootOptions are applied around this Task, as in a task of a v1alpha2 Workflow: the
                                boot mode and netboot toggle before it, and netboot off, ISO eject and customboot post
                                operations after it succeeds. They are used as written: a BootMode is carried out
                                through the Hardware's BMC, so Tinkerbell fails the Workflow on Hardware without one.
                                When no entry of the list sets BootOptions, the first entry gets the machine's
                                spec.bootOptions, with netboot toggled.
                              properties:
                                bootMode:
                                  description: BootMode is the type of booting that
                                    will be done. One of "netboot", "isoboot", or
                                    "customboot".
                                  enum:
                                  - netboot
                                  - isoboot
                                  - customboot
                                  type: string
                                customboot:
                                  description: |-
                                    Customboot is the configuration for the "customboot" boot mode.
                                    This allows users to define custom BMC Operations for pre and post a Task.
                                  properties:
                                    postOperations:
                                      description: |-
                                        PostOperations are the BMC operations that will be run after all Task Actions have completed.
                                        In most cases these operations should get a machine into a state where it can be powered off or rebooted and remove any mounted virtual media.
                                        These operations will be run only if all the associated Task Actions complete successfully.
                                      items:
                                        description: |-
                                          Operations defines the operations that can be performed against a BMC.
                                          Only a single field in the struct should be defined at any given time
                                          as only one operation can be performed at a time.
                                          For example either PowerAction or BootDevice.
                                        properties:
                                          bootDevice:
                                            description: BootDevice is the device
                                              to set as the first boot device on the
                                              Machine.
                                            properties:
                                              efiBoot:
                                                description: EFIBoot indicates whether
                                                  the boot device should be set to
                                                  efiboot mode.
                                                type: boolean
                                              name:
                                                description: Name is the name of the
                                                  device to set as the first boot
                                                  device.
                                                type: string
                                              persistent:
                                                description: Persistent indicates
                                                  whether the boot device should be
                                                  set persistently as the first boot
                                                  device.
                                                type: boolean
                                            type: object
                                          networkBootConfig:
                                            description: |-
                                              NetworkBootConfig enables/disables network boot protocol capabilities (UEFI HTTP Boot,
                                              legacy PXE) in BIOS/UEFI firmware, and/or sets the URL UEFI HTTP Boot fetches its boot
                                              image from. Support for the specific BMC vendor is implemented in bmclib.
                                            minProperties: 1
                                            properties:
                                              httpBootEnabled:
                                                description: |-
                                                  HTTPBootEnabled enables (true) or disables (false) UEFI HTTP Boot capability, IPv4 and
                                                  IPv6 both.
                                                type: boolean
                                              httpBootTLSMode:
                                                description: |-
                                                  HTTPBootTLSMode sets the TLS authentication mode UEFI HTTP Boot uses to connect to the HTTP
                                                  boot server: "None" allows fetching the boot image over plain HTTP, "OneWay" requires HTTPS
                                                  with the server authenticated by the client. Some hardware defaults to "OneWay", which
                                                  rejects an HTTPBootURL that isn't HTTPS. Independent of HTTPBootEnabled and HTTPBootURL.
                                                enum:
                                                - None
                                                - OneWay
                                                type: string
                                              httpBootURL:
                                                description: |-
                                                  HTTPBootURL sets the URL UEFI HTTP Boot fetches its boot image from, via the standard
                                                  Redfish ComputerSystem.Boot.HttpBootUri property. Independent of HTTPBootEnabled: setting
                                                  the URL does not enable the capability, and enabling the capability does not require a URL.
                                                format: uri
                                                type: string
                                                x-kubernetes-validations:
                                                - message: httpBootURL must be an
                                                    http or https URL
                                                  rule: self.startsWith('http://')
                                                    || self.startsWith('https://')
                                              pxeBootEnabled:
                                                description: PXEBootEnabled enables
                                                  (true) or disables (false) legacy
                                                  PXE boot capability.
                                                type: boolean
                                            type: object
                                          powerAction:
                                            allOf:
                                            - enum:
                                              - "on"
                                              - "off"
                                              - soft
                                              - status
                                              - cycle
                                              - reset
                                            - enum:
                                              - "on"
                                              - "off"
                                              - soft
                                              - status
                                              - cycle
                                              - reset
                                            description: PowerAction represents a
                                              baseboard management power operation.
                                            type: string
                                          timeoutSeconds:
                                            description: |-
                                              TimeoutSeconds defines the maximum time in seconds the Operation is allowed to run.
                                              If not defined, the default from the runtime is used.
                                            format: int64
                                            type: integer
                                          virtualMediaAction:
                                            description: VirtualMediaAction represents
                                              a baseboard management virtual media
                                              insert/eject.
                                            properties:
                                              kind:
                                                description: Kind represents the kind
                                                  of virtual media.
                                                type: string
                                              mediaURL:
