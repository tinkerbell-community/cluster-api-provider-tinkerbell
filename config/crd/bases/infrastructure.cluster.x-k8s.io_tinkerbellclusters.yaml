                                    ? 1 : 0) + (has(self.virtualMediaAction) ? 1 :
                                    0) + (has(self.networkBootConfig) ? 1 : 0) ==
                                    1'
                              type: array
                            preOperations:
                              description: |-
                                PreOperations are the BMC operations that will be run before any Task Actions.
                                In most cases these operations should get a machine into a state where a Tink Agent is running.
                              items:
                                description: |-
                                  Operations defines the operations that can be performed against a BMC.
                                  Only a single field in the struct should be defined at any given time
                                  as only one operation can be performed at a time.
                                  For example either PowerAction or BootDevice.
                                properties:
                                  bootDevice:
                                    description: BootDevice is the device to set as
                                      the first boot device on the Machine.
                                    properties:
                                      efiBoot:
                                        description: EFIBoot indicates whether the
                                          boot device should be set to efiboot mode.
                                        type: boolean
                                      name:
                                        description: Name is the name of the device
                                          to set as the first boot device.
                                        type: string
                                      persistent:
                                        description: Persistent indicates whether
                                          the boot device should be set persistently
                                          as the first boot device.
                                        type: boolean
                                    type: object
                                  networkBootConfig:
                                    description: |-
                                      NetworkBootConfig enables/disables network boot protocol capabilities (UEFI HTTP Boot,
                                      legacy PXE) in BIOS/UEFI firmware, and/or sets the URL UEFI HTTP Boot fetches its boot
                                      image from. Support for the specific BMC vendor is implemented in bmclib.
                                    minProperties: 1
                                    properties:
                                      httpBootEnabled:
                                        description: |-
                                          HTTPBootEnabled enables (true) or disables (false) UEFI HTTP Boot capability, IPv4 and
                                          IPv6 both.
                                        type: boolean
                                      httpBootTLSMode:
                                        description: |-
                                          HTTPBootTLSMode sets the TLS authentication mode UEFI HTTP Boot uses to connect to the HTTP
                                          boot server: "None" allows fetching the boot image over plain HTTP, "OneWay" requires HTTPS
                                          with the server authenticated by the client. Some hardware defaults to "OneWay", which
                                          rejects an HTTPBootURL that isn't HTTPS. Independent of HTTPBootEnabled and HTTPBootURL.
                                        enum:
                                        - None
                                        - OneWay
                                        type: string
                                      httpBootURL:
                                        description: |-
                                          HTTPBootURL sets the URL UEFI HTTP Boot fetches its boot image from, via the standard
                                          Redfish ComputerSystem.Boot.HttpBootUri property. Independent of HTTPBootEnabled: setting
                                          the URL does not enable the capability, and enabling the capability does not require a URL.
                                        format: uri
                                        type: string
                                        x-kubernetes-validations:
                                        - message: httpBootURL must be an http or
                                            https URL
                                          rule: self.startsWith('http://') || self.startsWith('https://')
                                      pxeBootEnabled:
                                        description: PXEBootEnabled enables (true)
                                          or disables (false) legacy PXE boot capability.
                                        type: boolean
                                    type: object
                                  powerAction:
                                    allOf:
                                    - enum:
                                      - "on"
                                      - "off"
                                      - soft
                                      - status
                                      - cycle
                                      - reset
                                    - enum:
                                      - "on"
                                      - "off"
                                      - soft
                                      - status
                                      - cycle
                                      - reset
                                    description: PowerAction represents a baseboard
                                      management power operation.
                                    type: string
                                  timeoutSeconds:
                                    description: |-
