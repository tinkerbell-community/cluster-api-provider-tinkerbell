                                  This includes all retries.
                                format: int64
                                type: integer
                              volumes:
                                description: Volumes defines the volumes that will
                                  be mounted into the container.
                                items:
                                  description: "Volume is a specification for mounting
                                    a location on a Host into an Action container.\nVolumes
                                    take the form {SRC-VOLUME-NAME | SRC-HOST-DIR}:TGT-CONTAINER-DIR:OPTIONS.\nWhen
                                    specifying a VOLUME-NAME that does not exist it
                                    will be created for you.\nExamples:\n\nRead-only
                                    bind mount bound to /data\n\n\t/etc/data:/data:ro\n\nWritable
                                    volume name bound to /data\n\n\tshared_volume:/data\n\nSee
                                    https://docs.docker.com/storage/volumes/ for additional
                                    details."
                                  type: string
                                type: array
